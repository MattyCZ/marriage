<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ondra & Verča · 10. 10. 2026</title>
  <meta name="description" content="Svatba Ondry a Verči — 10. října 2026" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Parisienne&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='80'%3E%F0%9F%8D%82%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --burgundy: #8f2626;
      --slate-blue: #59769c;
      --gold: #bda879;
      --burnt-orange: #b3612e;
      --cream: #f6efe3;
      --cream-deep: #ebdfc9;
      --ink: #2a1a14;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: 'Cormorant Garamond', Georgia, serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 20% 0%, rgba(179, 97, 46, 0.18), transparent 55%),
        radial-gradient(ellipse at 80% 100%, rgba(89, 118, 156, 0.16), transparent 55%),
        radial-gradient(ellipse at 50% 50%, rgba(189, 168, 121, 0.12), transparent 70%),
        linear-gradient(180deg, var(--cream) 0%, var(--cream-deep) 100%);
      background-attachment: fixed;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160' viewBox='0 0 160 160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.55 0 0 0 0 0.4 0 0 0 0 0.25 0 0 0 0.18 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      opacity: 0.45;
      mix-blend-mode: multiply;
      z-index: 0;
    }

    .leaf {
      position: fixed;
      pointer-events: none;
      opacity: 0.55;
      z-index: 1;
      filter: drop-shadow(0 4px 8px rgba(42, 26, 20, 0.12));
    }
    .leaf--tl { top: -40px; left: -40px; width: 280px; transform: rotate(-15deg); }
    .leaf--br { bottom: -60px; right: -60px; width: 320px; transform: rotate(160deg); }
    .leaf--tr { top: 60px; right: -30px; width: 180px; transform: rotate(40deg); opacity: 0.4; }
    .leaf--bl { bottom: 80px; left: -20px; width: 160px; transform: rotate(-120deg); opacity: 0.4; }

    main {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(2rem, 6vw, 5rem) 1.25rem;
    }

    .card {
      max-width: 760px;
      width: 100%;
      text-align: center;
      padding: clamp(2.5rem, 6vw, 5rem) clamp(1.5rem, 5vw, 4rem);
      position: relative;
    }

    .monogram {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .monogram .line {
      width: clamp(40px, 10vw, 80px);
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--burnt-orange), transparent);
    }
    .monogram .ampersand {
      font-family: 'Parisienne', cursive;
      font-size: clamp(2rem, 5vw, 3rem);
      color: var(--burgundy);
      line-height: 1;
    }

    .eyebrow {
      font-family: 'Parisienne', cursive;
      font-size: clamp(1.1rem, 2.5vw, 1.5rem);
      color: var(--burnt-orange);
      letter-spacing: 0.02em;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-weight: 400;
      font-size: clamp(3rem, 9vw, 6.5rem);
      line-height: 1;
      letter-spacing: 0.01em;
      color: var(--burgundy);
      margin: 0.25rem 0 1rem;
    }

    h1 .amp {
      font-family: 'Parisienne', cursive;
      font-weight: 400;
      color: var(--burnt-orange);
      font-size: 0.85em;
      vertical-align: -0.05em;
      padding: 0 0.15em;
    }

    .date-block {
      display: inline-flex;
      align-items: center;
      gap: clamp(0.75rem, 2.5vw, 1.5rem);
      margin: 1.5rem 0 0.5rem;
    }
    .date-block .date-side {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(0.95rem, 2vw, 1.2rem);
      color: var(--slate-blue);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .date-block .date-num {
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      font-weight: 500;
      color: var(--ink);
      letter-spacing: 0.05em;
      border-top: 1px solid var(--gold);
      border-bottom: 1px solid var(--gold);
      padding: 0.4rem 1rem;
    }

    .venue {
      margin-top: 1.75rem;
    }
    .venue-label {
      display: block;
      font-size: 0.72rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--slate-blue);
      margin-bottom: 0.5rem;
      font-weight: 500;
    }
    .venue-name {
      font-style: italic;
      font-weight: 400;
      color: var(--burgundy);
      font-size: clamp(1.5rem, 3.4vw, 2.1rem);
      letter-spacing: 0.02em;
      line-height: 1.15;
    }
    .venue-links {
      margin-top: 0.75rem;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
    }
    .venue-links a {
      color: var(--burnt-orange);
      text-decoration: none;
      border-bottom: 1px solid rgba(179, 97, 46, 0.35);
      padding-bottom: 1px;
      transition: color 0.2s ease, border-color 0.2s ease;
    }
    .venue-links a:hover,
    .venue-links a:focus-visible {
      color: var(--burgundy);
      border-color: var(--burgundy);
      outline: none;
    }
    .venue-links .sep {
      margin: 0 0.6rem;
      color: var(--gold);
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin: 2.5rem auto;
      color: var(--gold);
    }
    .divider .rule {
      width: clamp(60px, 15vw, 140px);
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    .divider svg { width: 22px; height: 22px; color: var(--burnt-orange); }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(0.5rem, 2vw, 1.25rem);
      max-width: 520px;
      margin: 0 auto;
    }
    .countdown .unit {
      padding: 1rem 0.5rem;
      border: 1px solid rgba(143, 38, 38, 0.18);
      background: rgba(246, 239, 227, 0.55);
      backdrop-filter: blur(2px);
      border-radius: 4px;
    }
    .countdown .num {
      display: block;
      font-size: clamp(1.6rem, 5vw, 2.5rem);
      font-weight: 500;
      color: var(--burgundy);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .countdown .label {
      display: block;
      margin-top: 0.5rem;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--slate-blue);
      font-weight: 500;
    }

    .message {
      margin-top: 2.5rem;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(1.05rem, 2.2vw, 1.25rem);
      color: var(--ink);
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.6;
    }

    footer {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 1rem 1rem 2rem;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
    }

    @media (max-width: 480px) {
      .leaf--tr, .leaf--bl { display: none; }
      .date-block { flex-direction: column; gap: 0.5rem; }
      .date-block .date-side { letter-spacing: 0.3em; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }

    .fade-in {
      animation: fadeIn 1.4s ease-out both;
    }
    .fade-in.delay-1 { animation-delay: 0.2s; }
    .fade-in.delay-2 { animation-delay: 0.4s; }
    .fade-in.delay-3 { animation-delay: 0.6s; }
    .fade-in.delay-4 { animation-delay: 0.8s; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <!-- Decorative autumn leaves -->
  <svg class="leaf leaf--tl" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#b3612e" />
        <stop offset="100%" stop-color="#8f2626" />
      </linearGradient>
    </defs>
    <path fill="url(#g1)" d="M100 15 C 60 50, 30 90, 30 130 C 30 165, 65 185, 100 185 C 135 185, 170 165, 170 130 C 170 90, 140 50, 100 15 Z" />
    <path stroke="#5a2010" stroke-width="1.5" fill="none" d="M100 15 L100 185 M100 60 L60 90 M100 60 L140 90 M100 100 L55 130 M100 100 L145 130 M100 140 L70 160 M100 140 L130 160" />
  </svg>

  <svg class="leaf leaf--br" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#bda879" />
        <stop offset="100%" stop-color="#b3612e" />
      </linearGradient>
    </defs>
    <path fill="url(#g2)" d="M100 20 C 70 40, 50 75, 50 115 C 50 155, 75 180, 100 180 C 125 180, 150 155, 150 115 C 150 75, 130 40, 100 20 Z" />
    <path stroke="#6b3712" stroke-width="1.2" fill="none" d="M100 20 L100 180 M100 70 L70 95 M100 70 L130 95 M100 110 L65 135 M100 110 L135 135" />
  </svg>

  <svg class="leaf leaf--tr" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#59769c" />
        <stop offset="100%" stop-color="#8f2626" />
      </linearGradient>
    </defs>
    <path fill="url(#g3)" d="M100 30 C 75 55, 60 90, 65 130 C 70 165, 95 175, 100 175 C 105 175, 130 165, 135 130 C 140 90, 125 55, 100 30 Z" />
    <path stroke="#3d2a20" stroke-width="1" fill="none" d="M100 30 L100 175" />
  </svg>

  <svg class="leaf leaf--bl" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#bda879" />
        <stop offset="100%" stop-color="#59769c" />
      </linearGradient>
    </defs>
    <path fill="url(#g4)" d="M100 25 C 75 45, 55 80, 55 120 C 55 160, 80 180, 100 180 C 120 180, 145 160, 145 120 C 145 80, 125 45, 100 25 Z" />
    <path stroke="#3d2a20" stroke-width="1" fill="none" d="M100 25 L100 180" />
  </svg>

  <main>
    <article class="card">
      <div class="monogram fade-in">
        <span class="line"></span>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--burgundy);" aria-hidden="true">
          <path d="M12 21s-7-4.5-9.5-9.5C1 8 3 4 7 4c2 0 3.5 1 5 3 1.5-2 3-3 5-3 4 0 6 4 4.5 7.5C19 16.5 12 21 12 21z"/>
        </svg>
        <span class="line"></span>
      </div>

      <p class="eyebrow fade-in delay-1">budeme se brát</p>

      <h1 class="fade-in delay-1">Ondra <span class="amp">&amp;</span> Verča</h1>

      <div class="date-block fade-in delay-2" aria-label="10. října 2026">
        <span class="date-side">Sobota</span>
        <span class="date-num">10 · 10 · 2026</span>
        <span class="date-side">Říjen</span>
      </div>

      <section class="venue fade-in delay-2" aria-label="Místo konání">
        <span class="venue-label">Místo</span>
        <p class="venue-name">Ztracená stodola</p>
        <p class="venue-links">
          <a href="https://www.ztracenastodola.cz/" target="_blank" rel="noopener noreferrer">ztracenastodola.cz</a>
          <span class="sep" aria-hidden="true">·</span>
          <a href="https://www.google.com/maps?q=49.9735342,16.1863497" target="_blank" rel="noopener noreferrer">mapa</a>
        </p>
      </section>

      <div class="divider fade-in delay-2" aria-hidden="true">
        <span class="rule"></span>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L13.5 9 L21 9.5 L15 14 L17 21.5 L12 17 L7 21.5 L9 14 L3 9.5 L10.5 9 Z" opacity="0.6"/></svg>
        <span class="rule"></span>
      </div>

      <div class="countdown fade-in delay-3" id="countdown" aria-live="polite">
        <div class="unit"><span class="num" id="cd-d">—</span><span class="label">Dní</span></div>
        <div class="unit"><span class="num" id="cd-h">—</span><span class="label">Hodin</span></div>
        <div class="unit"><span class="num" id="cd-m">—</span><span class="label">Minut</span></div>
        <div class="unit"><span class="num" id="cd-s">—</span><span class="label">Sekund</span></div>
      </div>

      <p class="message fade-in delay-4">
        Detaily se ještě dolaďují — brzy zde najdete program, ubytování i odpovědní formulář. Zatím si rezervujte datum.
      </p>
    </article>
  </main>

  <footer>Ondra &amp; Verča · 10 · 10 · 2026</footer>

  <script>
    (function () {
      const target = new Date('2026-10-10T11:00:00+02:00').getTime();
      const els = {
        d: document.getElementById('cd-d'),
        h: document.getElementById('cd-h'),
        m: document.getElementById('cd-m'),
        s: document.getElementById('cd-s'),
      };

      function pad(n) { return String(n).padStart(2, '0'); }

      function tick() {
        const now = Date.now();
        let diff = Math.max(0, target - now);
        const days = Math.floor(diff / 86400000); diff -= days * 86400000;
        const hours = Math.floor(diff / 3600000); diff -= hours * 3600000;
        const mins = Math.floor(diff / 60000); diff -= mins * 60000;
        const secs = Math.floor(diff / 1000);
        els.d.textContent = days;
        els.h.textContent = pad(hours);
        els.m.textContent = pad(mins);
        els.s.textContent = pad(secs);
      }

      tick();
      setInterval(tick, 1000);
    })();
  </script>
</body>
</html>
