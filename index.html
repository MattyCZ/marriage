<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veronika & Ondřej · 10. 10. 2026</title>
  <meta name="description" content="Svatba Veroniky a Ondřeje — 10. října 2026, Ztracená stodola" />
  <meta property="og:title" content="Veronika & Ondřej · 10. 10. 2026" />
  <meta property="og:description" content="Budeme se brát — srdečně Vás zveme. Sobota 10. 10. 2026, Ztracená stodola." />
  <meta property="og:image" content="oznameni.png" />
  <meta name="theme-color" content="#FFEDD7" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Parisienne&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='80'%3E%F0%9F%8D%82%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      /* sampled directly from the printed artwork */
      --cream: #ffedd7;
      --burgundy: #8f2626;
      --burgundy-deep: #732020;
      --gold: #a5814c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Cormorant Garamond', Georgia, serif;
      color: var(--burgundy);
      background: var(--cream);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    img { display: block; max-width: 100%; height: auto; }

    .wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 0 1.25rem;
    }

    /* ---------- flower bands (real artwork, blended into the cream page) ---------- */
    .band {
      width: 100%;
      max-width: 880px;
      margin: 0 auto;
      pointer-events: none;
    }
    .band--top { margin-bottom: clamp(-2.5rem, -4vw, -1.25rem); }
    .band--bottom { margin-top: clamp(1rem, 3vw, 2rem); }

    /* ---------- hero ---------- */
    .hero {
      text-align: center;
      padding-top: clamp(0.5rem, 2vw, 1.5rem);
    }
    .eyebrow {
      font-weight: 500;
      font-size: clamp(0.85rem, 2.6vw, 1.05rem);
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--burgundy);
      margin-bottom: clamp(0.75rem, 2vw, 1.25rem);
    }
    .names {
      font-weight: 600;
      font-size: clamp(2.8rem, 12vw, 5.5rem);
      line-height: 0.98;
      letter-spacing: 0.01em;
      color: var(--burgundy);
    }
    .amp {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(0.6rem, 2vw, 1.1rem);
      margin: clamp(0.1rem, 0.6vw, 0.4rem) 0;
    }
    .amp .flourish {
      width: clamp(70px, 18vw, 130px);
      height: auto;
    }
    .amp .flourish.flip { transform: scaleX(-1); }
    .amp .sign {
      font-family: 'Parisienne', cursive;
      font-weight: 400;
      font-size: clamp(2.2rem, 8vw, 3.6rem);
      color: var(--burgundy);
      line-height: 1;
    }

    .date-info { margin-top: clamp(1.75rem, 4vw, 2.5rem); }
    .date-info .day,
    .date-info .time {
      font-weight: 500;
      font-size: clamp(0.85rem, 2.4vw, 1.05rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--burgundy);
    }
    .date-info .date-big {
      font-weight: 600;
      font-size: clamp(2.1rem, 8vw, 3.4rem);
      line-height: 1.05;
      letter-spacing: 0.01em;
      color: var(--burgundy);
      margin: clamp(0.4rem, 1.2vw, 0.7rem) 0;
    }
    .venue-line {
      margin-top: clamp(1.6rem, 4vw, 2.25rem);
      font-weight: 500;
      font-size: clamp(1rem, 3vw, 1.3rem);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--burgundy);
    }

    /* ---------- flourish divider ---------- */
    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(0.6rem, 2vw, 1rem);
      margin: clamp(2.75rem, 6vw, 4rem) auto clamp(1.5rem, 3vw, 2rem);
    }
    .divider img { width: clamp(80px, 22vw, 150px); height: auto; }
    .divider img.flip { transform: scaleX(-1); }

    /* ---------- sections (map + rsvp) ---------- */
    .section { text-align: center; }
    .section-eyebrow {
      font-family: 'Parisienne', cursive;
      font-size: clamp(1.5rem, 5vw, 2.1rem);
      color: var(--gold);
      line-height: 1;
      margin-bottom: 0.35rem;
    }
    .section-title {
      font-weight: 500;
      font-size: clamp(1.7rem, 5vw, 2.5rem);
      line-height: 1.1;
      color: var(--burgundy);
      margin-bottom: clamp(1rem, 2.5vw, 1.5rem);
    }

    .links {
      margin: 0.25rem 0 1.25rem;
      font-size: clamp(1.05rem, 2.4vw, 1.25rem);
      font-style: italic;
      letter-spacing: 0.02em;
    }
    .links a {
      color: var(--burgundy);
      text-decoration: none;
      border-bottom: 1px solid rgba(143, 38, 38, 0.35);
      padding-bottom: 1px;
      transition: color 0.2s ease, border-color 0.2s ease;
    }
    .links a:hover,
    .links a:focus-visible {
      color: var(--burgundy-deep);
      border-color: var(--burgundy-deep);
      outline: none;
    }
    .links .sep { margin: 0 0.6rem; color: var(--gold); }

    .frame {
      margin: 0 auto;
      max-width: 600px;
      border: 1px solid rgba(143, 38, 38, 0.22);
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(143, 38, 38, 0.12);
      background: #fff;
    }
    .frame--map { aspect-ratio: 3 / 2; }
    .frame--rsvp { height: clamp(900px, 90vh, 1000px); }
    .frame iframe { width: 100%; height: 100%; border: 0; display: block; }
    .frame--map iframe { filter: saturate(0.92); }

    .fallback { margin: 0 0 1.1rem; font-size: 1.05rem; font-style: italic; }
    .fallback a {
      color: var(--burgundy);
      text-decoration: none;
      border-bottom: 1px solid rgba(143, 38, 38, 0.35);
      padding-bottom: 1px;
    }
    .fallback a:hover { color: var(--burgundy-deep); border-color: var(--burgundy-deep); }

    footer {
      text-align: center;
      padding: clamp(0.5rem, 2vw, 1rem) 1rem 2rem;
      font-family: 'Parisienne', cursive;
      font-size: clamp(1.4rem, 4vw, 1.9rem);
      color: var(--burgundy);
      line-height: 1.2;
    }
    footer small {
      display: block;
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.95rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <!-- top flower band (cropped from the printed announcement) -->
  <img class="band band--top" src="assets/flowers-top.png"
       width="1452" height="360" alt="" aria-hidden="true" />

  <main>
    <section class="hero wrap" aria-label="Svatební oznámení">
      <p class="eyebrow">Budeme se brát</p>

      <div class="names">
        <div>Veronika</div>
        <div class="amp" aria-hidden="true">
          <img class="flourish flip" src="assets/flourish.png" width="360" height="150" alt="" />
          <span class="sign">&amp;</span>
          <img class="flourish" src="assets/flourish.png" width="360" height="150" alt="" />
        </div>
        <div>Ondřej</div>
      </div>

      <div class="date-info">
        <div class="day">Sobota</div>
        <div class="date-big">10. 10. 2026</div>
        <div class="time">v 11:00 hodin</div>
      </div>
    </section>

    <div class="divider" aria-hidden="true">
      <img class="flip" src="assets/flourish.png" width="360" height="150" alt="" />
      <img src="assets/flourish.png" width="360" height="150" alt="" />
    </div>

    <!-- Venue + map -->
    <section class="section wrap" aria-label="Místo konání">
      <p class="section-eyebrow">Místo konání</p>
      <h2 class="section-title">Ztracená stodola</h2>
      <p class="links">
        <a href="https://www.ztracenastodola.cz/" target="_blank" rel="noopener noreferrer">ztracenastodola.cz</a>
        <span class="sep" aria-hidden="true">·</span>
        <a href="https://www.google.com/maps/place/Ztracen%C3%A1+stodola/@49.9732129,16.1850783,18.21z/data=!4m12!1m5!3m4!2zNDnCsDU4JzI0LjciTiAxNsKwMTEnMTAuOSJF!8m2!3d49.9735342!4d16.1863497!3m5!1s0x470de9b88e7688ab:0xfe868532599b8aa9!8m2!3d49.973726!4d16.1862524!16s%2Fg%2F11xzhx57_v" target="_blank" rel="noopener noreferrer">otevřít v mapách</a>
      </p>
      <div class="frame frame--map">
        <iframe
          src="https://maps.google.com/maps?q=49.9735342,16.1863497&hl=cs&z=17&output=embed"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          title="Mapa: Ztracená stodola"
          allowfullscreen></iframe>
      </div>
    </section>

    <div class="divider" aria-hidden="true">
      <img class="flip" src="assets/flourish.png" width="360" height="150" alt="" />
      <img src="assets/flourish.png" width="360" height="150" alt="" />
    </div>

    <!-- RSVP -->
    <section class="section wrap" aria-label="Odpovědní formulář">
      <h2 class="section-title">Potvrďte nám svou účast</h2>
      <p class="fallback">
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSfOlZFwMx0hf9waGHx43_0wX4ulyW6Ns1bpcDitbPvH83X1iA/viewform" target="_blank" rel="noopener noreferrer">Otevřít formulář v novém okně</a>
      </p>
      <div class="frame frame--rsvp">
        <iframe
          src="https://docs.google.com/forms/d/e/1FAIpQLSfOlZFwMx0hf9waGHx43_0wX4ulyW6Ns1bpcDitbPvH83X1iA/viewform?embedded=true"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          title="Odpovědní formulář — svatba Veroniky a Ondřeje">
          Načítám…
        </iframe>
      </div>
    </section>
  </main>

  <!-- bottom flower band (cropped from the printed table card) -->
  <img class="band band--bottom" src="assets/flowers-bottom.png"
       width="2048" height="320" alt="" aria-hidden="true" />
</body>
</html>
